name: Telegram queue

# The admin function (Yandex Cloud) cannot reach api.telegram.org, so it queues post updates
# in data/tg-queue.json. This workflow sends them from GitHub and clears the queue.
on:
  push:
    branches: [main]
    paths: [data/tg-queue.json]
  workflow_dispatch:
    inputs:
      force_nav:
        description: Re-post and pin the navigation post even if the queue is empty
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: tg-queue
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pushes made with the Actions token never start workflows, so the queue-clearing commit can't loop;
    # the actor check is an extra guard
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/admin-api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/admin-api/requirements.txt
      - run: pip install -r tools/admin-api/requirements.txt
      - name: Send queued post updates
        id: flush
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          APP_REPO: ""
          COMMIT_SUFFIX: " [skip ci]"
          FORCE_NAV: ${{ inputs.force_nav || 'false' }}
        run: python tools/admin-api/flush_tg_queue.py
      - name: Redeploy the site if new posts changed the Mini App catalog
        if: steps.flush.outputs.posts_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main -R "${{ github.repository }}"
